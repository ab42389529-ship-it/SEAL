            "app/src/main/java/com/prismflow/downloader/PrismApp.kt": """package com.prismflow.downloader

        import android.app.Application
        import android.app.NotificationChannel
        import android.app.NotificationManager
        import android.os.Build
        import com.yausername.youtubedl_android.YoutubeDL
        import kotlinx.coroutines.CoroutineScope
        import kotlinx.coroutines.Dispatchers
        import kotlinx.coroutines.launch

        class PrismApp : Application() {
            companion object {
                const val CHANNEL_ID = "prism_flow_downloads"
                const val CHANNEL_NAME = "PRISM FLOW Media Downloads"
            }

            override fun onCreate() {
                super.onCreate()
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    val channel = NotificationChannel(
                        CHANNEL_ID, CHANNEL_NAME, NotificationManager.IMPORTANCE_LOW
                    )
                    getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
                }
                CoroutineScope(Dispatchers.IO).launch {
                    try {
                        YoutubeDL.getInstance().init(applicationContext)
                    } catch (_: Exception) {}
                }
            }
        }
        """,
            "app/src/main/java/com/prismflow/downloader/data/DownloadItem.kt": """package com.prismflow.downloader.data

        import androidx.room.Entity
        import androidx.room.PrimaryKey

        enum class DownloadStatus { QUEUED, DOWNLOADING, MERGING, COMPLETED, FAILED, CANCELLED }

        @Entity(tableName = "downloads")
        data class DownloadItem(
            @PrimaryKey val id: String,
            val url: String,
            val title: String,
            val formatId: String,
            val resolution: String,
            val ext: String,
            val isAudioOnly: Boolean,
            val thumbnail: String? = null,
            val progress: Float = 0f,
            val speed: String = "",
            val eta: String = "",
            val filePath: String? = null,
            val status: DownloadStatus = DownloadStatus.QUEUED,
            val errorMessage: String? = null,
            val timestamp: Long = System.currentTimeMillis()
        )
        """,
            "app/src/main/java/com/prismflow/downloader/data/DownloadDao.kt": """package com.prismflow.downloader.data

        import androidx.room.*
        import kotlinx.coroutines.flow.Flow

        @Dao
        interface DownloadDao {
            @Query("SELECT * FROM downloads ORDER BY timestamp DESC")
            fun getAllDownloads(): Flow<List<DownloadItem>>

            @Query("SELECT * FROM downloads WHERE status = 'COMPLETED' ORDER BY timestamp DESC")
            fun getCompletedMedia(): Flow<List<DownloadItem>>

            @Query("SELECT * FROM downloads WHERE id = :id LIMIT 1")
            suspend fun getDownloadById(id: String): DownloadItem?

            @Insert(onConflict = OnConflictStrategy.REPLACE)
            suspend fun insertOrUpdate(item: DownloadItem)

            @Delete
            suspend fun delete(item: DownloadItem)

            @Query("DELETE FROM downloads")
            suspend fun clearAll()
        }
        """,
            "app/src/main/java/com/prismflow/downloader/data/AppDatabase.kt": """package com.prismflow.downloader.data

        import android.content.Context
        import androidx.room.Database
        import androidx.room.Room
        import androidx.room.RoomDatabase

        @Database(entities = [DownloadItem::class], version = 1, exportSchema = false)
        abstract class AppDatabase : RoomDatabase() {
            abstract fun downloadDao(): DownloadDao

            companion object {
                @Volatile private var INSTANCE: AppDatabase? = null
                fun getDatabase(context: Context): AppDatabase = INSTANCE ?: synchronized(this) {
                    val inst = Room.databaseBuilder(context.applicationContext, AppDatabase::class.java, "prism.db").build()
                    INSTANCE = inst
                    inst
                }
            }
        }
        """,
            "app/src/main/java/com/prismflow/downloader/data/ThemePreferences.kt": """package com.prismflow.downloader.data

        import android.content.Context

        enum class AppTheme { PRISM, OCEAN, SUNSET, MINT }

        class ThemePreferences(context: Context) {
            private val prefs = context.getSharedPreferences("prism_prefs", Context.MODE_PRIVATE)
            fun getTheme(): AppTheme {
                val name = prefs.getString("theme", AppTheme.PRISM.name) ?: AppTheme.PRISM.name
                return try { AppTheme.valueOf(name) } catch (_: Exception) { AppTheme.PRISM }
            }
            fun setTheme(theme: AppTheme) = prefs.edit().putString("theme", theme.name).apply()
        }
        """,
            "app/src/main/java/com/prismflow/downloader/data/ExtractorRepository.kt": """package com.prismflow.downloader.data

        import android.content.Context
        import com.yausername.youtubedl_android.YoutubeDL
        import kotlinx.coroutines.Dispatchers
        import kotlinx.coroutines.withContext

        data class MediaFormatOption(val formatId: String, val resolution: String, val ext: String, val isAudioOnly: Boolean)
        data class ExtractedMediaInfo(val url: String, val title: String, val duration: String, val thumbnail: String?, val formats: List<MediaFormatOption>)

        class ExtractorRepository(private val context: Context) {
            suspend fun analyzeUrl(url: String): Result<ExtractedMediaInfo> = withContext(Dispatchers.IO) {
                try {
                    val info = YoutubeDL.getInstance().getInfo(url)
                    val options = mutableListOf<MediaFormatOption>()
                    options.add(MediaFormatOption("bestvideo+bestaudio/best", "সর্বোচ্চ কোয়ালিটি (Auto Merge)", "mp4", false))
                    info.formats?.forEach { fmt ->
                        val isAudio = (fmt.vcodec == "none" || fmt.vcodec == null) && fmt.acodec != "none"
                        val res = if (!isAudio) "${fmt.height}p" else "Audio (${fmt.acodec ?: "mp3"})"
                        options.add(MediaFormatOption(fmt.formatId ?: "best", res, fmt.ext ?: "mp4", isAudio))
                    }
                    options.add(MediaFormatOption("bestaudio/best", "অডিও MP3 (High Quality)", "mp3", true))
                    Result.success(ExtractedMediaInfo(url, info.title ?: "ভিডিও", "${info.duration}s", info.thumbnail, options))
                } catch (e: Exception) {
                    Result.failure(Exception(e.message ?: "বিশ্লেষণ ব্যর্থ হয়েছে"))
                }
            }
        }
        """,
            "app/src/main/java/com/prismflow/downloader/service/DownloadForegroundService.kt": """package com.prismflow.downloader.service

        import android.app.*
        import android.content.Intent
        import android.os.Environment
        import android.os.IBinder
        import androidx.core.app.NotificationCompat
        import com.prismflow.downloader.PrismApp
        import com.prismflow.downloader.data.*
        import com.yausername.youtubedl_android.YoutubeDL
        import com.yausername.youtubedl_android.YoutubeDLRequest
        import kotlinx.coroutines.*
        import java.io.File

        class DownloadForegroundService : Service() {
            private val job = SupervisorJob()
            private val scope = CoroutineScope(Dispatchers.IO + job)

            override fun onBind(intent: Intent?): IBinder? = null

            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                val id = intent?.getStringExtra("EXTRA_ID") ?: return START_NOT_STICKY
                startForeground(1001, buildNotification("ডাউনলোড শুরু হচ্ছে...", 0))
                scope.launch {
                    val db = AppDatabase.getDatabase(applicationContext)
                    val item = db.downloadDao().getDownloadById(id) ?: return@launch
                    try {
                        val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "PRISM_FLOW")
                        if (!dir.exists()) dir.mkdirs()
                        val req = YoutubeDLRequest(item.url)
                        req.addOption("-o", "${dir.absolutePath}/%(title)s.%(ext)s")
                        if (item.isAudioOnly) {
                            req.addOption("-x")
                            req.addOption("--audio-format", "mp3")
                        } else {
                            req.addOption("-f", item.formatId)
                        }
                        db.downloadDao().insertOrUpdate(item.copy(status = DownloadStatus.DOWNLOADING))
                        YoutubeDL.getInstance().execute(req, id) { progress, eta, line ->
                            scope.launch {
                                db.downloadDao().insertOrUpdate(item.copy(progress = progress, eta = "${eta}s"))
                            }
                            updateNotification("ডাউনলোড হচ্ছে: ${progress.toInt()}%", progress.toInt())
                        }
                        db.downloadDao().insertOrUpdate(item.copy(status = DownloadStatus.COMPLETED, progress = 100f))
                    } catch (e: Exception) {
                        db.downloadDao().insertOrUpdate(item.copy(status = DownloadStatus.FAILED, errorMessage = e.message))
                    } finally {
                        stopForeground(STOP_FOREGROUND_DETACH)
                    }
                }
                return START_NOT_STICKY
            }

            private fun buildNotification(text: String, progress: Int) =
                NotificationCompat.Builder(this, PrismApp.CHANNEL_ID)
                    .setContentTitle("PRISM FLOW ডাউনলোডার")
                    .setContentText(text)
                    .setSmallIcon(android.R.drawable.stat_sys_download)
                    .setProgress(100, progress, progress == 0)
                    .build()

            private fun updateNotification(text: String, progress: Int) {
                val m = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                m.notify(1001, buildNotification(text, progress))
            }

            override fun onDestroy() { job.cancel(); super.onDestroy() }
        }
        """,
