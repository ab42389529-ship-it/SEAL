      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate All PRISM FLOW Source Files
      run: |
        python3 - << 'EOF'
